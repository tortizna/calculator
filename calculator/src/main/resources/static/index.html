<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuzzy Logic Calculator</title>

    <!-- Bootstrap 5 CSS via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <style>
        /* Дополнительные стили для центрирования карточки по вертикали */
        body {
            background-color: #f8f9fa; /* Светлый фон для контраста */
        }
        .main-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <!-- Карточка с формой -->
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h5 class="card-title text-center mb-4">Fuzzy Logic Calculator</h5>

                        <form id="fuzzyForm">
                            <!-- Поле Check Value -->
                            <div class="mb-3">
                                <label for="checkValue" class="form-label">Check Value</label>
                                <input type="number" class="form-control" id="checkValue" step="any" required>
                            </div>

                            <!-- Поле Radius -->
                            <div class="mb-3">
                                <label for="radius" class="form-label">Radius</label>
                                <input type="number" class="form-control" id="radius" step="any" required>
                            </div>

                            <!-- Поле Cycle Max -->
                            <div class="mb-3">
                                <label for="cycleMax" class="form-label">Cycle Max <span class="text-muted">(не обязательно)</span></label>
                                <input type="number" class="form-control" id="cycleMax">
                            </div>

                            <!-- Поле History Data -->
                            <div class="mb-3">
                                <label for="historyData" class="form-label">History Data</label>
                                <textarea class="form-control" id="historyData" rows="4" placeholder="Пример: 4.0=4, 2.0=2"></textarea>
                            </div>

                            <!-- Кнопка отправки -->
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    Calculate Fuzzy Logic
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Блок для отображения результата -->
                <div id="resultAlert" class="alert mt-4 d-none" role="alert">
                    <!-- Результат будет вставлен сюда с помощью JavaScript -->
                </div>

            </div>
        </div>
        <!-- НОВАЯ СТРОКА ДЛЯ ТАБЛИЦЫ ИСТОРИИ -->
        <div class="row justify-content-center mt-5">
            <div class="col-md-10 col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h5 class="card-title text-center mb-4">History</h5>
                        <div class="table-responsive">
                            <table class="table table-hover table-bordered text-center">
                                <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Check Value</th>
                                    <th>Radius</th>
                                    <th>Result</th>
                                    <th>Status</th>
                                    <th>Date</th>
                                </tr>
                                </thead>
                                <tbody id="historyTableBody">
                                <!-- Сюда JS будет вставлять строки -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- JavaScript-логика -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('fuzzyForm');
        const resultAlert = document.getElementById('resultAlert');
        const historyTableBody = document.getElementById('historyTableBody'); // Находим тело таблицы

        // --- НОВАЯ ФУНКЦИЯ ЗАГРУЗКИ ИСТОРИИ ---
        async function loadHistory() {
            try {
                const response = await fetch('/api/fuzzy/history');
                if (!response.ok) throw new Error('Ошибка загрузки истории');

                const historyData = await response.json();

                // Очищаем таблицу перед обновлением
                historyTableBody.innerHTML = '';

                // Пробегаемся по каждому элементу истории и создаем строку <tr>
                historyData.forEach(item => {
                    const row = document.createElement('tr');

                    // Красиво форматируем дату
                    const date = new Date(item.createdAt).toLocaleString('ru-RU');

                    // Раскрашиваем статус: если OK - зеленый, если ANOMALY - красный
                    const statusBadge = item.statusMessage === 'OK'
                        ? `<span class="badge bg-success">OK</span>`
                        : `<span class="badge bg-danger">${item.statusMessage}</span>`;

                    row.innerHTML = `
                        <td>${item.id}</td>
                        <td>${item.checkValue}</td>
                        <td>${item.radius}</td>
                        <td><strong>${item.resultValue.toFixed(2)}</strong></td>
                        <td>${statusBadge}</td>
                        <td>${date}</td>
                    `;
                    historyTableBody.appendChild(row);
                });
            } catch (error) {
                console.error('Не удалось загрузить историю:', error);
            }
        }

        // Вызываем загрузку истории сразу при открытии страницы!
        loadHistory();

        // --- ТВОЙ ОБРАБОТЧИК ФОРМЫ ---
        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            resultAlert.classList.add('d-none');
            resultAlert.classList.remove('alert-success', 'alert-danger');

            const checkValue = document.getElementById('checkValue').value;
            const radius = document.getElementById('radius').value;
            const cycleMax = document.getElementById('cycleMax').value;
            const historyDataText = document.getElementById('historyData').value;

            const history = {};
            if (historyDataText.trim() !== '') {
                const pairs = historyDataText.split(',');
                pairs.forEach(pair => {
                    const parts = pair.split('=');
                    if (parts.length === 2) {
                        const key = parts[0].trim();
                        const value = parts[1].trim();
                        if (key && value) {
                            history[key] = parseFloat(value);
                        }
                    }
                });
            }

            const requestBody = {
                checkValue: parseFloat(checkValue),
                radius: parseFloat(radius),
                cycleMax: cycleMax ? parseInt(cycleMax, 10) : null,
                history: history
            };

            try {
                const response = await fetch('/api/fuzzy/calculate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({ message: 'Не удалось обработать ответ сервера.' }));
                    throw new Error(errorData.message || `Ошибка сервера: ${response.status}`);
                }

                const data = await response.json();

                // ВАЖНО: ТУТ ИЗМЕНЕНИЯ! У тебя Спринг возвращает объект FuzzyResponse
                // В сервисе мы назвали поля resultValue и statusMessage (или как они у тебя называются в DTO?)
                // Если в DTO у тебя поля названы result и message, оставляем как есть:
                if (data.result !== undefined || data.resultValue !== undefined) {
                    const finalResult = data.result !== undefined ? data.result : data.resultValue;
                    resultAlert.innerHTML = `Результат: <strong>${finalResult.toFixed(2)}</strong> (Статус: ${data.message || data.statusMessage})`;
                    resultAlert.classList.add('alert-success');
                    resultAlert.classList.remove('d-none');

                    // МАГИЯ: Загружаем историю заново, чтобы новая запись сразу появилась в таблице!
                    loadHistory();
                } else {
                    throw new Error('Ответ сервера не содержит поля результата.');
                }

            } catch (error) {
                console.error('Ошибка при отправке запроса:', error);
                resultAlert.textContent = `Произошла ошибка: ${error.message}`;
                resultAlert.classList.add('alert-danger');
                resultAlert.classList.remove('d-none');
            }
        });
    });
</script>
</body>
</html>
